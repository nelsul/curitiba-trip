name: CI

# Runs on every pull request (required to pass before merging into main)
# and is reused by the deploy workflow before each deploy.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Design tokens are up to date
        run: node ../design/build-tokens.mjs --check
      - run: npm ci
      - name: Type check (svelte-check)
        run: npm run check
      - name: Build (app + worker)
        run: npm run build
