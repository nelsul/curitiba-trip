# XcodeGen spec: `cd ios && xcodegen` generates CuritibaTrip.xcodeproj (git-ignored).
name: CuritibaTrip
options:
  bundleIdPrefix: com.nelsul
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
packages:
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 12.9.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CuritibaTrip:
    type: application
    platform: iOS
    sources:
      - path: CuritibaTrip
    dependencies:
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nelsul.curitibatrip
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: CuritibaTrip/Info.plist
      properties:
        CFBundleDisplayName: Viagem
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - Fredoka-Medium.ttf
          - Fredoka-SemiBold.ttf
          - Nunito-Regular.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
