name: Deploy

# Every merge into main that touches the web app deploys it to viagem.nelsul.com.
# Secrets live in the "production" environment, which only protected branches (main) can use,
# so workflows from pull requests and forks never see them.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://viagem.nelsul.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write .env from secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          umask 077
          for v in DB_PASSWORD AUTH_SECRET SMTP_HOST SMTP_USERNAME SMTP_PASSWORD R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::secret $v is empty"; exit 1; }
          done
          {
            echo "ORIGIN=https://viagem.nelsul.com"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'AUTH_SECRET=%s\n' "$AUTH_SECRET"
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-465}"
            printf 'SMTP_USERNAME=%s\n' "$SMTP_USERNAME"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            printf 'SMTP_FROM_EMAIL=%s\n' "$SMTP_FROM_EMAIL"
            printf 'R2_ACCOUNT_ID=%s\n' "$R2_ACCOUNT_ID"
            printf 'R2_ACCESS_KEY_ID=%s\n' "$R2_ACCESS_KEY_ID"
            printf 'R2_SECRET_ACCESS_KEY=%s\n' "$R2_SECRET_ACCESS_KEY"
            printf 'R2_BUCKET=%s\n' "$R2_BUCKET"
          } > web/.env

      - name: Set up SSH (pinned host key)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The deploy key is locked on the server to one script (~/bin/deploy-viagem) that
      # unpacks this bundle into ~/apps/viagem and runs `docker compose up -d --build`.
      - name: Ship and rebuild on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          tar -czf - -C web \
            --exclude=node_modules --exclude=.svelte-kit --exclude=build --exclude=build-worker \
            --exclude=docker-compose.dev.yml . \
          | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 "claude@${DEPLOY_HOST}"

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://viagem.nelsul.com/login | grep -q "Passaporte da viagem"; then
              echo "viagem.nelsul.com is up"; exit 0
            fi
            sleep 6
          done
          echo "::error::site did not come back after deploy"; exit 1

      - name: Remove secrets from the runner
        if: always()
        run: rm -f web/.env ~/.ssh/deploy_key
